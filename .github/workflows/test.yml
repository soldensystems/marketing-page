name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contact_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: contact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contact_test -d contact_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://contact_test:local_test_only@127.0.0.1:5432/contact_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code
